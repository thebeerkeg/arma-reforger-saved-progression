<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{TITLE}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tbk: {
            bg: '#0b0f14',
            panel: '#11161d',
            border: '#1f2933',
            accent: '#f59e0b',
          },
        },
      },
    },
  };
</script>
</head>
<body class="bg-tbk-bg text-slate-200 min-h-screen font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex items-end justify-between mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">{{TITLE}}</h1>
        <p class="text-sm text-slate-400 mt-1">{{SUBTITLE}}</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="updated" class="text-xs text-slate-500"></span>
        <button id="refresh"
          class="px-3 py-1.5 text-sm rounded-md bg-tbk-panel border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent transition">
          Refresh
        </button>
      </div>
    </header>

    <nav class="mb-6 flex items-center gap-2 border-b border-tbk-border">
      <button data-tab="players" class="tab-btn px-4 py-2 text-sm border-b-2 border-tbk-accent text-white">
        Players
      </button>
      <button data-tab="matches" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-slate-400 hover:text-white">
        Matches
      </button>
    </nav>

    <!-- ===== Players tab ===== -->
    <div id="tab-players">
      <section id="tiles" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"></section>

      <section class="bg-tbk-panel border border-tbk-border rounded-lg overflow-hidden">
        <div class="px-4 py-3 border-b border-tbk-border flex items-center justify-between gap-3 flex-wrap">
          <h2 class="font-semibold text-white">Leaderboard</h2>
          <input id="search" type="search" placeholder="Search players…" autocomplete="off"
            class="px-3 py-1.5 text-sm rounded-md bg-tbk-bg border border-tbk-border placeholder:text-slate-500 focus:border-tbk-accent focus:outline-none w-48 sm:w-64" />
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-xs uppercase tracking-wider text-slate-400 bg-black/20">
              <tr>
                <th class="px-4 py-2 w-12">#</th>
                <th class="px-4 py-2">Player</th>
                <th class="px-4 py-2 text-right">Score</th>
                <th class="px-4 py-2 text-right">Kills</th>
                <th class="px-4 py-2 text-right">Deaths</th>
              </tr>
            </thead>
            <tbody id="lb-body" class="divide-y divide-tbk-border">
              <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="px-4 py-3 border-t border-tbk-border flex items-center justify-between gap-3 flex-wrap">
          <span id="lb-count" class="text-xs text-slate-500"></span>
          <div class="flex items-center gap-2">
            <button id="prev"
              class="px-3 py-1 text-sm rounded-md bg-tbk-bg border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent disabled:opacity-40 disabled:hover:border-tbk-border disabled:hover:text-slate-200 transition">
              Prev
            </button>
            <span id="page-info" class="text-xs text-slate-400 tabular-nums min-w-[6rem] text-center"></span>
            <button id="next"
              class="px-3 py-1 text-sm rounded-md bg-tbk-bg border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent disabled:opacity-40 disabled:hover:border-tbk-border disabled:hover:text-slate-200 transition">
              Next
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- ===== Matches tab ===== -->
    <div id="tab-matches" class="hidden">
      <section class="bg-tbk-panel border border-tbk-border rounded-lg overflow-hidden">
        <div class="px-4 py-3 border-b border-tbk-border flex items-center justify-between gap-3 flex-wrap">
          <h2 class="font-semibold text-white">Recent Matches</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-xs uppercase tracking-wider text-slate-400 bg-black/20">
              <tr>
                <th class="px-4 py-2">Started</th>
                <th class="px-4 py-2">Scenario</th>
                <th class="px-4 py-2">Winner</th>
                <th class="px-4 py-2 text-right">Players</th>
                <th class="px-4 py-2 text-right">Score</th>
                <th class="px-4 py-2">Result</th>
              </tr>
            </thead>
            <tbody id="m-body" class="divide-y divide-tbk-border">
              <tr><td colspan="6" class="px-4 py-6 text-center text-slate-500">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="px-4 py-3 border-t border-tbk-border flex items-center justify-between gap-3 flex-wrap">
          <span id="m-count" class="text-xs text-slate-500"></span>
          <div class="flex items-center gap-2">
            <button id="m-prev"
              class="px-3 py-1 text-sm rounded-md bg-tbk-bg border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent disabled:opacity-40 disabled:hover:border-tbk-border disabled:hover:text-slate-200 transition">
              Prev
            </button>
            <span id="m-page-info" class="text-xs text-slate-400 tabular-nums min-w-[6rem] text-center"></span>
            <button id="m-next"
              class="px-3 py-1 text-sm rounded-md bg-tbk-bg border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent disabled:opacity-40 disabled:hover:border-tbk-border disabled:hover:text-slate-200 transition">
              Next
            </button>
          </div>
        </div>
      </section>
    </div>

    <p id="error" class="hidden mt-4 text-sm text-red-400"></p>
  </div>

  <!-- Player detail modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/70"></div>
    <div class="relative bg-tbk-panel border border-tbk-border rounded-lg shadow-xl w-full max-w-lg">
      <div class="flex items-center justify-between px-5 py-3 border-b border-tbk-border">
        <h3 id="modal-title" class="font-semibold text-white truncate">Player</h3>
        <button id="modal-close"
          class="text-slate-400 hover:text-white text-xl leading-none px-2"
          aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="p-5 text-sm">
        <div class="text-slate-500">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Match detail modal -->
  <div id="m-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="m-modal-backdrop" class="absolute inset-0 bg-black/70"></div>
    <div class="relative bg-tbk-panel border border-tbk-border rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-3 border-b border-tbk-border sticky top-0 bg-tbk-panel">
        <h3 id="m-modal-title" class="font-semibold text-white truncate">Match</h3>
        <button id="m-modal-close"
          class="text-slate-400 hover:text-white text-xl leading-none px-2"
          aria-label="Close">&times;</button>
      </div>
      <div id="m-modal-body" class="p-5 text-sm">
        <div class="text-slate-500">Loading…</div>
      </div>
    </div>
  </div>

<script>
  const fmtInt = (n) => Number(n).toLocaleString();
  const fmtPlaytime = (s) => {
    s = Math.max(0, Number(s) | 0);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  };
  const fmtDate = (s) => {
    if (!s) return '—';
    const d = new Date(s);
    return isNaN(d) ? String(s) : d.toLocaleString();
  };
  const fmtDuration = (start, end) => {
    if (!start || !end) return '—';
    const a = new Date(start), b = new Date(end);
    if (isNaN(a) || isNaN(b)) return '—';
    const sec = Math.max(0, Math.floor((b - a) / 1000));
    return fmtPlaytime(sec);
  };
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

  const TILES = [
    { key: 'total_players',          label: 'Players',     fmt: fmtInt },
    { key: 'total_score',            label: 'Total Score', fmt: fmtInt },
    { key: 'total_kills',            label: 'Kills',       fmt: fmtInt },
    { key: 'total_ai_kills',         label: 'AI Kills',    fmt: fmtInt },
    { key: 'total_deaths',           label: 'Deaths',      fmt: fmtInt },
    { key: 'total_objectives',       label: 'Objectives',  fmt: fmtInt },
    { key: 'total_playtime_seconds', label: 'Playtime',    fmt: fmtPlaytime },
  ];

  function renderTiles(agg) {
    const html = TILES.map(t => `
      <div class="bg-tbk-panel border border-tbk-border rounded-lg px-4 py-3">
        <div class="text-xs uppercase tracking-wider text-slate-400">${t.label}</div>
        <div class="mt-1 text-2xl font-semibold text-white tabular-nums">${t.fmt(agg[t.key] ?? 0)}</div>
      </div>
    `).join('');
    document.getElementById('tiles').innerHTML = html;
  }

  // ---- tab switching ----
  let activeTab = 'players';
  function setTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const on = btn.dataset.tab === name;
      btn.classList.toggle('border-tbk-accent', on);
      btn.classList.toggle('text-white', on);
      btn.classList.toggle('border-transparent', !on);
      btn.classList.toggle('text-slate-400', !on);
    });
    document.getElementById('tab-players').classList.toggle('hidden', name !== 'players');
    document.getElementById('tab-matches').classList.toggle('hidden', name !== 'matches');
    if (name === 'matches' && !matchesState.loaded) {
      loadMatches();
    }
  }
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  const PAGE_SIZE = 25;
  const state = { page: 0, search: '', total: 0 };

  function renderLeaderboard(rows, total, offset) {
    const body = document.getElementById('lb-body');
    state.total = total;

    if (!rows.length) {
      const msg = state.search
        ? `No players match "${escapeHtml(state.search)}".`
        : 'No players yet.';
      body.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">${msg}</td></tr>`;
    } else {
      body.innerHTML = rows.map(r => `
        <tr data-uid="${escapeHtml(r.player_uid)}" data-name="${escapeHtml(r.last_known_name)}"
            class="cursor-pointer hover:bg-black/30 transition-colors">
          <td class="px-4 py-2 text-slate-500 tabular-nums">${r.rank}</td>
          <td class="px-4 py-2 text-white">${escapeHtml(r.last_known_name)}</td>
          <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.total_score)}</td>
          <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.kills)}</td>
          <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.deaths)}</td>
        </tr>
      `).join('');
    }

    const from = total === 0 ? 0 : offset + 1;
    const to = offset + rows.length;
    document.getElementById('lb-count').textContent = total === 0
      ? '0 players'
      : `Showing ${fmtInt(from)}–${fmtInt(to)} of ${fmtInt(total)}`;

    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const currentPage = Math.min(state.page, totalPages - 1);
    document.getElementById('page-info').textContent = `Page ${currentPage + 1} / ${totalPages}`;
    document.getElementById('prev').disabled = currentPage <= 0;
    document.getElementById('next').disabled = currentPage >= totalPages - 1;
  }

  // ---- player detail modal ----
  const modal = document.getElementById('modal');
  const modalBody = document.getElementById('modal-body');
  const modalTitle = document.getElementById('modal-title');

  function openModal() {
    modal.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }
  function closeModal() {
    modal.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
    modalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
  }

  function renderPlayer(p) {
    const rows = [
      ['Player UID',  p.player_uid,                              'font-mono text-xs break-all'],
      ['Total Score', fmtInt(p.total_score),                     'tabular-nums'],
      ['Kills',       fmtInt(p.kills),                           'tabular-nums'],
      ['AI Kills',    fmtInt(p.ai_kills),                        'tabular-nums'],
      ['Deaths',      fmtInt(p.deaths),                          'tabular-nums'],
      ['Objectives',  fmtInt(p.objectives),                      'tabular-nums'],
      ['Playtime',    fmtPlaytime(p.playtime_seconds),           'tabular-nums'],
      ['First Seen',  fmtDate(p.first_seen),                     ''],
      ['Last Seen',   fmtDate(p.last_seen),                      ''],
    ];
    modalBody.innerHTML = `
      <dl class="divide-y divide-tbk-border">
        ${rows.map(([k, v, cls]) => `
          <div class="grid grid-cols-3 gap-3 py-2">
            <dt class="text-slate-400">${k}</dt>
            <dd class="col-span-2 text-white ${cls}">${escapeHtml(v)}</dd>
          </div>
        `).join('')}
      </dl>
    `;
  }

  async function showPlayer(uid, name) {
    modalTitle.textContent = name || uid;
    modalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
    openModal();
    try {
      const res = await fetch(`/api/player/${encodeURIComponent(uid)}`, { cache: 'no-store' });
      if (res.status === 404) {
        modalBody.innerHTML = '<div class="text-slate-500">Player not found.</div>';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const p = await res.json();
      renderPlayer(p);
    } catch (e) {
      modalBody.innerHTML = `<div class="text-red-400">Failed to load: ${escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById('lb-body').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-uid]');
    if (!row) return;
    showPlayer(row.dataset.uid, row.dataset.name);
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
  });

  // ---- matches list ----
  const matchesState = { page: 0, total: 0, loaded: false };

  // The "Result" badge — the addon may end matches with `victory`, `draw`,
  // `abandoned`, `timeout`, or anything else. Color the common cases; leave
  // unknown values neutral so a custom end_reason still renders intelligibly.
  function resultBadge(m) {
    if (!m.end_time) {
      return `<span class="px-2 py-0.5 text-xs rounded bg-yellow-500/15 text-yellow-300 border border-yellow-500/30">live</span>`;
    }
    const r = (m.end_reason || '').toLowerCase();
    const cls = (
      r === 'victory' ? 'bg-green-500/15 text-green-300 border-green-500/30' :
      r === 'draw'    ? 'bg-slate-500/15 text-slate-300 border-slate-500/30' :
      r === 'abandoned' ? 'bg-red-500/15 text-red-300 border-red-500/30' :
      'bg-slate-500/15 text-slate-300 border-slate-500/30'
    );
    return `<span class="px-2 py-0.5 text-xs rounded border ${cls}">${escapeHtml(m.end_reason || 'ended')}</span>`;
  }

  function renderMatches(rows, total, offset) {
    const body = document.getElementById('m-body');
    matchesState.total = total;

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-slate-500">No matches yet.</td></tr>`;
    } else {
      body.innerHTML = rows.map(m => `
        <tr data-id="${escapeHtml(m.id)}" class="cursor-pointer hover:bg-black/30 transition-colors">
          <td class="px-4 py-2 text-slate-300">${escapeHtml(fmtDate(m.start_time))}</td>
          <td class="px-4 py-2 text-white">${escapeHtml(m.scenario)}</td>
          <td class="px-4 py-2 text-white">${escapeHtml(m.winning_faction || '—')}</td>
          <td class="px-4 py-2 text-right tabular-nums">${fmtInt(m.player_count)}</td>
          <td class="px-4 py-2 text-right tabular-nums">${fmtInt(m.total_score)}</td>
          <td class="px-4 py-2">${resultBadge(m)}</td>
        </tr>
      `).join('');
    }

    const from = total === 0 ? 0 : offset + 1;
    const to = offset + rows.length;
    document.getElementById('m-count').textContent = total === 0
      ? '0 matches'
      : `Showing ${fmtInt(from)}–${fmtInt(to)} of ${fmtInt(total)}`;

    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const currentPage = Math.min(matchesState.page, totalPages - 1);
    document.getElementById('m-page-info').textContent = `Page ${currentPage + 1} / ${totalPages}`;
    document.getElementById('m-prev').disabled = currentPage <= 0;
    document.getElementById('m-next').disabled = currentPage >= totalPages - 1;
  }

  async function loadMatches() {
    const params = new URLSearchParams({
      limit: String(PAGE_SIZE),
      offset: String(matchesState.page * PAGE_SIZE),
    });
    const res = await fetch(`/api/matches?${params}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    matchesState.loaded = true;
    renderMatches(data.entries || [], data.total || 0, data.offset || 0);
  }

  // ---- match detail modal ----
  const mModal = document.getElementById('m-modal');
  const mModalBody = document.getElementById('m-modal-body');
  const mModalTitle = document.getElementById('m-modal-title');
  function openMatchModal() {
    mModal.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }
  function closeMatchModal() {
    mModal.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
    mModalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
  }

  function renderMatchSummary(s) {
    const meta = [
      ['Match ID',     s.id,                                       'font-mono text-xs break-all'],
      ['Scenario',     s.scenario,                                 ''],
      ['Started',      fmtDate(s.start_time),                      ''],
      ['Ended',        fmtDate(s.end_time),                        ''],
      ['Duration',     fmtDuration(s.start_time, s.end_time),      'tabular-nums'],
      ['Winner',       s.winning_faction || '—',                   ''],
      ['Result',       s.end_reason || (s.end_time ? 'ended' : 'live'), ''],
    ];

    const factionRows = (s.factions || []).map(f => `
      <tr>
        <td class="px-3 py-1.5 text-white">${escapeHtml(f.faction)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(f.total_score)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(f.kills)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(f.deaths)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(f.player_count)}</td>
      </tr>
    `).join('');

    const playerRows = (s.players || []).map(p => `
      <tr>
        <td class="px-3 py-1.5 text-white">${escapeHtml(p.last_known_name)}</td>
        <td class="px-3 py-1.5 text-slate-300">${escapeHtml(p.faction)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(p.total_score)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(p.kills)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(p.ai_kills)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(p.deaths)}</td>
        <td class="px-3 py-1.5 text-right tabular-nums">${fmtInt(p.objectives)}</td>
      </tr>
    `).join('');

    mModalBody.innerHTML = `
      <section class="mb-5">
        <h4 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Overview</h4>
        <dl class="divide-y divide-tbk-border bg-tbk-bg/40 border border-tbk-border rounded-md">
          ${meta.map(([k, v, cls]) => `
            <div class="grid grid-cols-3 gap-3 py-2 px-3">
              <dt class="text-slate-400">${k}</dt>
              <dd class="col-span-2 text-white ${cls}">${escapeHtml(v)}</dd>
            </div>
          `).join('')}
        </dl>
      </section>

      <section class="mb-5">
        <h4 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Factions</h4>
        ${factionRows ? `
          <div class="overflow-x-auto bg-tbk-bg/40 border border-tbk-border rounded-md">
            <table class="w-full text-sm">
              <thead class="text-left text-xs uppercase tracking-wider text-slate-400 bg-black/20">
                <tr>
                  <th class="px-3 py-1.5">Faction</th>
                  <th class="px-3 py-1.5 text-right">Score</th>
                  <th class="px-3 py-1.5 text-right">Kills</th>
                  <th class="px-3 py-1.5 text-right">Deaths</th>
                  <th class="px-3 py-1.5 text-right">Players</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-tbk-border">${factionRows}</tbody>
            </table>
          </div>
        ` : `<div class="text-slate-500 text-sm">No faction data.</div>`}
      </section>

      <section>
        <h4 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Players</h4>
        ${playerRows ? `
          <div class="overflow-x-auto bg-tbk-bg/40 border border-tbk-border rounded-md">
            <table class="w-full text-sm">
              <thead class="text-left text-xs uppercase tracking-wider text-slate-400 bg-black/20">
                <tr>
                  <th class="px-3 py-1.5">Player</th>
                  <th class="px-3 py-1.5">Faction</th>
                  <th class="px-3 py-1.5 text-right">Score</th>
                  <th class="px-3 py-1.5 text-right">Kills</th>
                  <th class="px-3 py-1.5 text-right">AI Kills</th>
                  <th class="px-3 py-1.5 text-right">Deaths</th>
                  <th class="px-3 py-1.5 text-right">Obj</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-tbk-border">${playerRows}</tbody>
            </table>
          </div>
        ` : `<div class="text-slate-500 text-sm">No roster data.</div>`}
      </section>
    `;
  }

  async function showMatch(id) {
    mModalTitle.textContent = id;
    mModalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
    openMatchModal();
    try {
      const res = await fetch(`/api/match/${encodeURIComponent(id)}`, { cache: 'no-store' });
      if (res.status === 404) {
        mModalBody.innerHTML = '<div class="text-slate-500">Match not found.</div>';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const s = await res.json();
      mModalTitle.textContent = `${s.scenario}`;
      renderMatchSummary(s);
    } catch (e) {
      mModalBody.innerHTML = `<div class="text-red-400">Failed to load: ${escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById('m-body').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (!row) return;
    showMatch(row.dataset.id);
  });
  document.getElementById('m-modal-close').addEventListener('click', closeMatchModal);
  document.getElementById('m-modal-backdrop').addEventListener('click', closeMatchModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !mModal.classList.contains('hidden')) closeMatchModal();
  });

  document.getElementById('m-prev').addEventListener('click', () => {
    if (matchesState.page > 0) {
      matchesState.page--;
      loadMatches();
    }
  });
  document.getElementById('m-next').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(matchesState.total / PAGE_SIZE));
    if (matchesState.page < totalPages - 1) {
      matchesState.page++;
      loadMatches();
    }
  });

  // ---- bootstrapping ----
  async function loadAggregate() {
    const res = await fetch('/api/stats', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderTiles(data.aggregate || {});
  }

  async function loadLeaderboard() {
    const params = new URLSearchParams({
      limit: String(PAGE_SIZE),
      offset: String(state.page * PAGE_SIZE),
    });
    if (state.search) params.set('q', state.search);
    const res = await fetch(`/api/leaderboard?${params}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderLeaderboard(data.entries || [], data.total || 0, data.offset || 0);
  }

  async function load() {
    const err = document.getElementById('error');
    err.classList.add('hidden');
    try {
      const tasks = [loadAggregate(), loadLeaderboard()];
      if (activeTab === 'matches') tasks.push(loadMatches());
      await Promise.all(tasks);
      document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
      err.textContent = `Failed to load stats: ${e.message}`;
      err.classList.remove('hidden');
    }
  }

  // Search: debounce input, reset to page 0 on change.
  let searchTimer = null;
  document.getElementById('search').addEventListener('input', (e) => {
    const value = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (value === state.search) return;
      state.search = value;
      state.page = 0;
      loadLeaderboard().catch((err) => {
        const el = document.getElementById('error');
        el.textContent = `Failed to load stats: ${err.message}`;
        el.classList.remove('hidden');
      });
    }, 300);
  });

  document.getElementById('prev').addEventListener('click', () => {
    if (state.page > 0) {
      state.page--;
      loadLeaderboard();
    }
  });
  document.getElementById('next').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
    if (state.page < totalPages - 1) {
      state.page++;
      loadLeaderboard();
    }
  });

  document.getElementById('refresh').addEventListener('click', load);
  load();
  setInterval(load, 30_000);
</script>
</body>
</html>
