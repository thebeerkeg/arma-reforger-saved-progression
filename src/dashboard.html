<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{TITLE}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tbk: {
            bg: '#0b0f14',
            panel: '#11161d',
            border: '#1f2933',
            accent: '#f59e0b',
          },
        },
      },
    },
  };
</script>
</head>
<body class="bg-tbk-bg text-slate-200 min-h-screen font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex items-end justify-between mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">{{TITLE}}</h1>
        <p class="text-sm text-slate-400 mt-1">{{SUBTITLE}}</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="updated" class="text-xs text-slate-500"></span>
        <button id="refresh"
          class="px-3 py-1.5 text-sm rounded-md bg-tbk-panel border border-tbk-border hover:border-tbk-accent hover:text-tbk-accent transition">
          Refresh
        </button>
      </div>
    </header>

    <section id="tiles" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"></section>

    <section class="bg-tbk-panel border border-tbk-border rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-tbk-border flex items-center justify-between">
        <h2 class="font-semibold text-white">Leaderboard</h2>
        <span id="lb-count" class="text-xs text-slate-500"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-xs uppercase tracking-wider text-slate-400 bg-black/20">
            <tr>
              <th class="px-4 py-2 w-12">#</th>
              <th class="px-4 py-2">Player</th>
              <th class="px-4 py-2 text-right">Score</th>
              <th class="px-4 py-2 text-right">Kills</th>
              <th class="px-4 py-2 text-right">Deaths</th>
            </tr>
          </thead>
          <tbody id="lb-body" class="divide-y divide-tbk-border">
            <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <p id="error" class="hidden mt-4 text-sm text-red-400"></p>
  </div>

  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/70"></div>
    <div class="relative bg-tbk-panel border border-tbk-border rounded-lg shadow-xl w-full max-w-lg">
      <div class="flex items-center justify-between px-5 py-3 border-b border-tbk-border">
        <h3 id="modal-title" class="font-semibold text-white truncate">Player</h3>
        <button id="modal-close"
          class="text-slate-400 hover:text-white text-xl leading-none px-2"
          aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="p-5 text-sm">
        <div class="text-slate-500">Loading…</div>
      </div>
    </div>
  </div>

<script>
  const fmtInt = (n) => Number(n).toLocaleString();
  const fmtPlaytime = (s) => {
    s = Math.max(0, Number(s) | 0);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  };
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

  const TILES = [
    { key: 'total_players',          label: 'Players',     fmt: fmtInt },
    { key: 'total_score',            label: 'Total Score', fmt: fmtInt },
    { key: 'total_kills',            label: 'Kills',       fmt: fmtInt },
    { key: 'total_ai_kills',         label: 'AI Kills',    fmt: fmtInt },
    { key: 'total_deaths',           label: 'Deaths',      fmt: fmtInt },
    { key: 'total_objectives',       label: 'Objectives',  fmt: fmtInt },
    { key: 'total_playtime_seconds', label: 'Playtime',    fmt: fmtPlaytime },
  ];

  function renderTiles(agg) {
    const html = TILES.map(t => `
      <div class="bg-tbk-panel border border-tbk-border rounded-lg px-4 py-3">
        <div class="text-xs uppercase tracking-wider text-slate-400">${t.label}</div>
        <div class="mt-1 text-2xl font-semibold text-white tabular-nums">${t.fmt(agg[t.key] ?? 0)}</div>
      </div>
    `).join('');
    document.getElementById('tiles').innerHTML = html;
  }

  function renderLeaderboard(rows) {
    const body = document.getElementById('lb-body');
    document.getElementById('lb-count').textContent = `${rows.length} player${rows.length === 1 ? '' : 's'}`;
    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">No players yet.</td></tr>`;
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr data-uid="${escapeHtml(r.player_uid)}" data-name="${escapeHtml(r.last_known_name)}"
          class="cursor-pointer hover:bg-black/30 transition-colors">
        <td class="px-4 py-2 text-slate-500 tabular-nums">${r.rank}</td>
        <td class="px-4 py-2 text-white">${escapeHtml(r.last_known_name)}</td>
        <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.total_score)}</td>
        <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.kills)}</td>
        <td class="px-4 py-2 text-right tabular-nums">${fmtInt(r.deaths)}</td>
      </tr>
    `).join('');
  }

  // ---- player detail modal ----
  const modal = document.getElementById('modal');
  const modalBody = document.getElementById('modal-body');
  const modalTitle = document.getElementById('modal-title');

  function openModal() {
    modal.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }
  function closeModal() {
    modal.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
    modalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
  }

  function renderPlayer(p) {
    const fmtDate = (s) => {
      const d = new Date(s);
      return isNaN(d) ? String(s) : d.toLocaleString();
    };
    const rows = [
      ['Player UID',  p.player_uid,                              'font-mono text-xs break-all'],
      ['Total Score', fmtInt(p.total_score),                     'tabular-nums'],
      ['Kills',       fmtInt(p.kills),                           'tabular-nums'],
      ['AI Kills',    fmtInt(p.ai_kills),                        'tabular-nums'],
      ['Deaths',      fmtInt(p.deaths),                          'tabular-nums'],
      ['Objectives',  fmtInt(p.objectives),                      'tabular-nums'],
      ['Playtime',    fmtPlaytime(p.playtime_seconds),           'tabular-nums'],
      ['First Seen',  fmtDate(p.first_seen),                     ''],
      ['Last Seen',   fmtDate(p.last_seen),                      ''],
    ];
    modalBody.innerHTML = `
      <dl class="divide-y divide-tbk-border">
        ${rows.map(([k, v, cls]) => `
          <div class="grid grid-cols-3 gap-3 py-2">
            <dt class="text-slate-400">${k}</dt>
            <dd class="col-span-2 text-white ${cls}">${escapeHtml(v)}</dd>
          </div>
        `).join('')}
      </dl>
    `;
  }

  async function showPlayer(uid, name) {
    modalTitle.textContent = name || uid;
    modalBody.innerHTML = '<div class="text-slate-500">Loading…</div>';
    openModal();
    try {
      const res = await fetch(`/api/player/${encodeURIComponent(uid)}`, { cache: 'no-store' });
      if (res.status === 404) {
        modalBody.innerHTML = '<div class="text-slate-500">Player not found.</div>';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const p = await res.json();
      renderPlayer(p);
    } catch (e) {
      modalBody.innerHTML = `<div class="text-red-400">Failed to load: ${escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById('lb-body').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-uid]');
    if (!row) return;
    showPlayer(row.dataset.uid, row.dataset.name);
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
  });

  async function load() {
    const err = document.getElementById('error');
    err.classList.add('hidden');
    try {
      const res = await fetch('/api/stats', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderTiles(data.aggregate || {});
      renderLeaderboard(data.leaderboard || []);
      document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
      err.textContent = `Failed to load stats: ${e.message}`;
      err.classList.remove('hidden');
    }
  }

  document.getElementById('refresh').addEventListener('click', load);
  load();
  setInterval(load, 30_000);
</script>
</body>
</html>
